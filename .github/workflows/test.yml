name: Run tests

on:
    push:
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        strategy:
            matrix:
                node: [20.x, 22.x, 24.x]
                os: [ubuntu-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check
            # The model is not tracked in git, the suite needs the published one
            - name: Download model
              run: npm run update-model
            - run: npm test
            # EmailEngine and other CommonJS consumers load the esbuild bundle
            - name: Check the CommonJS build
              if: matrix.node == '20.x'
              run: |
                  npm run build
                  node test/cjs-smoke.cjs
            # pkg snapshots a CommonJS module graph, and Node 22+ hides ES modules behind require(esm).
            # Load the bundle with that switched off so an ES module in the graph fails here.
            - name: Check the CommonJS build with require(esm) disabled
              if: matrix.node != '20.x'
              run: npm run test:cjs
